name: release

# On every push to main, release-please keeps a release PR open that bumps the
# version and writes the changelog from the Conventional Commits since the last
# release; merging that PR tags the release.
#
# Publishing does not hang on that one run. Whenever the version on main is not
# on npm yet, this workflow publishes it — a merged release PR, or a release
# whose publish failed after it was tagged. A failed publish is then retried by
# the next push, and nothing is ever published twice.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored
# anywhere. npm accepts the publish because @unbranch/kit lists this repository
# and this workflow file as its trusted publisher, and it attaches provenance.
# The workflow's file name is part of that trust — renaming it breaks publishing
# until the trusted publisher on npmjs.com is updated to match.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Is this version on npm yet?
        id: npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@unbranch/kit@$version" version > /dev/null 2>&1; then
            echo "@unbranch/kit@$version is on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "@unbranch/kit@$version is not on npm yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm test
        if: steps.npm.outputs.publish == 'true'
      # Trusted publishing needs npm 11.5.1 or later, and `npm stage` came after
      # it; the newest npm has both.
      - run: npm install --global npm@latest
        if: steps.npm.outputs.publish == 'true'
      # A trusted publisher can be limited to staging. Then `npm publish` is
      # refused, and the version is staged instead — it goes live once a
      # maintainer approves it on npmjs.com with two-factor authentication.
      - run: npm publish || npm stage publish
        if: steps.npm.outputs.publish == 'true'
